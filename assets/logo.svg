  </g>

  <!-- Wordmark -->
  <text x="130" y="106"
        font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="1"
        fill="url(#textGrad)">Task<tspan fill="#2FB6FF">iva</tspan></text>
</svg>
